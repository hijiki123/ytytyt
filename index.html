<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StartUp</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="apple-touch-icon" href="/static/logo.png">
<meta name="theme-color" content="#f5f4f0">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/index.css">
</head>
<body>

<div id="loading-overlay" aria-hidden="true">
  <div class="lo-brand">
    <img src="/static/logo.png" alt="">
    <div class="lo-spinner"></div>
  </div>
  <div class="lo-text">読み込み中…</div>
</div>

<div id="startup-overlay">
  <nav class="su-nav">
    <div class="su-logo">
      <img src="/static/logo.png" alt="StartUp">
      <span>StartUp</span>
    </div>
    <div class="su-nav-links">
      <a class="su-nav-link" href="#">About</a>
      <a class="su-nav-link" href="#">Privacy</a>
    </div>
  </nav>

  <div class="su-hero">
    <div class="su-hero-inner">
      <div class="su-hero-badge"><span></span>マルチエンジン検索</div>
      <h1>探すなら、<em>StartUp</em> で。</h1>
      <p>Google、Bing、DuckDuckGo、Yahoo…お好みの検索エンジンを、検索ボックスの中から切り替え。ひとつの入力で、すべてにアクセス。</p>

      <div class="su-search-wrap">
        <div class="su-search-box" id="su-search-box">
          <div class="su-engine-picker" id="engine-picker">
            <button class="su-engine-toggle" id="engine-toggle" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="su-engine-pill">
                <span class="su-engine-dot" id="current-dot" style="background:#4285f4"></span>
                <span class="su-engine-name" id="current-engine-name">Google</span>
              </span>
              <svg class="su-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </button>

            <div class="su-engine-menu" id="engine-menu" role="menu" aria-label="検索エンジン">
              <button class="su-engine-option active" data-engine="google" type="button">
                <span class="su-engine-dot" style="background:#4285f4"></span>
                <span>
                  <span class="opt-name">Google</span>
                  <span class="opt-sub">google.com</span>
                </span>
              </button>
              <button class="su-engine-option" data-engine="bing" type="button">
                <span class="su-engine-dot" style="background:#00809d"></span>
                <span>
                  <span class="opt-name">Bing</span>
                  <span class="opt-sub">bing.com</span>
                </span>
              </button>
              <button class="su-engine-option" data-engine="duckduckgo" type="button">
                <span class="su-engine-dot" style="background:#de5833"></span>
                <span>
                  <span class="opt-name">DuckDuckGo</span>
                  <span class="opt-sub">duckduckgo.com</span>
                </span>
              </button>
              <button class="su-engine-option" data-engine="yahoo" type="button">
                <span class="su-engine-dot" style="background:#6001d2"></span>
                <span>
                  <span class="opt-name">Yahoo! Japan</span>
                  <span class="opt-sub">search.yahoo.co.jp</span>
                </span>
              </button>
            </div>
          </div>

          <div class="su-input-wrap">
            <span class="su-search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input id="su-input" type="text" placeholder="何でも検索…"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>

          <button class="su-search-go" onclick="handleSuSearch()" aria-label="検索">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="su-active-label" id="su-active-label"><strong>Google</strong> で検索します</div>

      <div class="su-hint">
        <div class="su-hint-item"><span class="su-hint-key">Enter</span> で検索</div>
        <div class="su-hint-item"><span class="su-hint-key">Tab</span> でボックス移動</div>
      </div>
    </div>
  </div>

  <footer class="su-footer">
    <div class="su-footer-links">
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
      <a href="mailto:hiziki.tools@proton.me">お問い合わせ</a>
    </div>
    <div class="su-footer-copy">
      <div>お問い合わせ: hiziki.tools@proton.me</div>
      <div>© 2026 StartUp</div>
    </div>
  </footer>
</div>

<script src="/static/index.js"></script>
</body>
</html>
