<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>StartUp Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230057ff'/><text x='16' y='22' text-anchor='middle' font-size='18' font-family='sans-serif' font-weight='bold' fill='white'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #f5f4f0;
  --surface:   #ffffff;
  --border:    #e2e0da;
  --text:      #18181b;
  --sub:       #71717a;
  --accent:    #0057ff;
  --accent-h:  #0040cc;
  --radius-lg: 20px;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }

#loading-overlay {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 9999; display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
#loading-overlay.visible { display: flex; }
.lo-spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .65s linear infinite;
}
.lo-text { font-size: 0.88rem; color: var(--sub); }
@keyframes spin { to { transform: rotate(360deg); } }

#startup-overlay {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 9998; display: flex; flex-direction: column; overflow-y: auto;
}
#startup-overlay.hidden { display: none; }

.su-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.su-logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
  letter-spacing: -0.5px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.su-logo-icon {
  width: 28px; height: 28px; background: var(--accent); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.75rem; font-weight: 800;
  font-family: 'Syne', sans-serif; flex-shrink: 0;
}
.su-nav-links { display: flex; gap: 6px; align-items: center; }
.su-nav-link {
  font-size: 0.8rem; color: var(--sub); text-decoration: none;
  padding: 6px 12px; border-radius: 99px; border: 1px solid transparent;
  transition: all .15s; cursor: pointer; background: none; font-family: inherit;
}
.su-nav-link:hover { background: var(--border); color: var(--text); }

.su-hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 24px 40px; text-align: center;
}
.su-hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: #e8f0ff; color: var(--accent);
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 5px 12px;
  border-radius: 99px; margin-bottom: 20px;
}
.su-hero-badge span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; }
.su-hero h1 {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.1;
  letter-spacing: -1.5px; color: var(--text); margin-bottom: 14px;
}
.su-hero h1 em { font-style: normal; color: var(--accent); }
.su-hero p { font-size: 0.95rem; color: var(--sub); line-height: 1.7; max-width: 440px; margin-bottom: 36px; }

.su-engine-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.su-engine-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px; border: 1.5px solid var(--border);
  border-radius: 99px; background: var(--surface);
  cursor: pointer; font-family: inherit; font-size: 0.82rem; font-weight: 600;
  color: var(--sub); transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.su-engine-btn:hover { border-color: var(--accent); color: var(--accent); background: #e8f0ff; }
.su-engine-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.su-engine-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.su-search-wrap { width: 100%; max-width: 580px; position: relative; margin-bottom: 12px; }
.su-search-box {
  display: flex; align-items: center;
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius-lg); padding: 0 18px; height: 58px;
  transition: border-color .15s, box-shadow .15s;
}
.su-search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,87,255,.1); }
.su-search-box.error { border-color: #ff3355; box-shadow: 0 0 0 4px rgba(255,51,85,.1); animation: shake .3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.su-search-icon { color: var(--sub); flex-shrink: 0; margin-right: 12px; display: flex; align-items: center; }
.su-search-box input {
  flex: 1; border: none; outline: none; font-size: 1rem;
  color: var(--text); background: transparent; font-family: inherit; min-width: 0;
}
.su-search-box input::placeholder { color: var(--sub); }
.su-search-go {
  background: var(--accent); border: none; border-radius: 10px;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; flex-shrink: 0; margin-left: 8px;
  transition: background .15s, transform .1s;
}
.su-search-go:hover { background: var(--accent-h); }
.su-search-go:active { transform: scale(.94); }

.su-active-label { font-size: 0.78rem; color: var(--sub); }
.su-active-label strong { color: var(--text); }

.su-hint { margin-top: 32px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.su-hint-item { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; color: var(--sub); }
.su-hint-key {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 5px; padding: 2px 7px;
  font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--text);
}

.su-footer {
  padding: 20px 28px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; flex-shrink: 0;
}
.su-footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
.su-footer a { font-size: 0.78rem; color: var(--sub); text-decoration: none; }
.su-footer a:hover { color: var(--text); }
.su-footer-copy { font-size: 0.76rem; color: var(--sub); font-family: 'Space Mono', monospace; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="lo-spinner"></div>
  <div class="lo-text">読み込み中…</div>
</div>

<div id="startup-overlay">
  <nav class="su-nav">
    <div class="su-logo">
      <div class="su-logo-icon">S</div>
      StartUp
    </div>
    <div class="su-nav-links">
      <a class="su-nav-link" href="#">About</a>
      <a class="su-nav-link" href="#">Privacy</a>
    </div>
  </nav>

  <div class="su-hero">
    <div class="su-hero-badge"><span></span>マルチエンジン検索</div>
    <h1>探すなら、<em>StartUp</em> で。</h1>
    <p>Google、Bing、DuckDuckGo、Yahoo…お好みの検索エンジンをワンタップで切り替え。ひとつの検索窓で、すべてにアクセス。</p>

    <div class="su-engine-row" id="engine-row">
      <button class="su-engine-btn active" data-engine="google" onclick="selectEngine(this)">
        <span class="su-engine-dot" style="background:#4285f4"></span> Google
      </button>
      <button class="su-engine-btn" data-engine="bing" onclick="selectEngine(this)">
        <span class="su-engine-dot" style="background:#00809d"></span> Bing
      </button>
      <button class="su-engine-btn" data-engine="duckduckgo" onclick="selectEngine(this)">
        <span class="su-engine-dot" style="background:#de5833"></span> DuckDuckGo
      </button>
      <button class="su-engine-btn" data-engine="yahoo" onclick="selectEngine(this)">
        <span class="su-engine-dot" style="background:#6001d2"></span> Yahoo! Japan
      </button>
    </div>

    <div class="su-search-wrap">
      <div class="su-search-box" id="su-search-box">
        <span class="su-search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input id="su-input" type="text" placeholder="何でも検索…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="su-search-go" onclick="handleSuSearch()" aria-label="検索">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="su-active-label" id="su-active-label"><strong>Google</strong> で検索します</div>

    <div class="su-hint">
      <div class="su-hint-item"><span class="su-hint-key">Enter</span> で検索</div>
      <div class="su-hint-item"><span class="su-hint-key">K</span> で緊急退出</div>
      <div class="su-hint-item"><span class="su-hint-key">Tab</span> でエンジン切替</div>
    </div>
  </div>

  <footer class="su-footer">
    <div class="su-footer-links">
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
      <a href="#">お問い合わせ</a>
    </div>
    <div class="su-footer-copy">© 2025 StartUp Search</div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);

const ENGINES = {
  google:     { name: 'Google',       url: q => 'https://www.google.com/search?q=' + encodeURIComponent(q) },
  bing:       { name: 'Bing',         url: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q) },
  duckduckgo: { name: 'DuckDuckGo',   url: q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q) },
  yahoo:      { name: 'Yahoo! Japan', url: q => 'https://search.yahoo.co.jp/search?p=' + encodeURIComponent(q) },
};

let currentEngine = 'google';
const engineKeys = Object.keys(ENGINES);

setTimeout(() => $('su-input').focus(), 80);

function selectEngine(btn) {
  document.querySelectorAll('.su-engine-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentEngine = btn.dataset.engine;
  $('su-active-label').innerHTML = '<strong>' + ENGINES[currentEngine].name + '</strong> で検索します';
}

$('su-input').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const idx = engineKeys.indexOf(currentEngine);
    selectEngine(document.querySelector('[data-engine="' + engineKeys[(idx + 1) % engineKeys.length] + '"]'));
  } else if (e.key === 'Enter') {
    handleSuSearch();
  }
});

async function handleSuSearch() {
  const val = $('su-input').value.trim();
  if (!val) return;

  $('loading-overlay').classList.add('visible');

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val }),
    });

    if (res.ok) {
      const appRes = await fetch('/api/app', {
        headers: { 'X-StreamBox-Auth': val },
      });

      if (appRes.ok) {
        const html = await appRes.text();
        document.open();
        document.write(html);
        document.close();
      } else {
        throw new Error('アプリの取得に失敗しました');
      }
    } else {
      $('loading-overlay').classList.remove('visible');
      window.location.href = ENGINES[currentEngine].url(val);
    }
  } catch (e) {
    $('loading-overlay').classList.remove('visible');
    const box = $('su-search-box');
    box.classList.add('error');
    setTimeout(() => {
      box.classList.remove('error');
      window.location.href = ENGINES[currentEngine].url(val);
    }, 400);
  }
}

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if ((e.key === 'k' || e.key === 'K') && tag !== 'INPUT' && tag !== 'TEXTAREA') {
    window.location.href = 'https://www.google.com';
  }
});
</script>
</body>
</html>
